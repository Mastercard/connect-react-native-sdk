// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }

    configurations.classpath {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "org.bouncycastle" &&
                    details.requested.name in ["bcprov-jdk18on", "bcpkix-jdk18on", "bcutil-jdk18on"]) {
                details.useVersion("1.86")
                details.because("Address Checkmarx SCA findings in Android build tooling")
            }

            if (details.requested.group == "com.google.protobuf" &&
                    details.requested.name in ["protobuf-java", "protobuf-java-util"]) {
                details.useVersion("3.25.5")
                details.because("CVE-2024-7254 fix: protobuf-java is patched in 3.25.5+")
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
